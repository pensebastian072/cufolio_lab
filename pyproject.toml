[project]
name = "cufolio_lab"
version = "0.1.0"
description = "Shadow portfolio-allocation sidecar for hq-trading-system (advisory only)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cufolio_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
